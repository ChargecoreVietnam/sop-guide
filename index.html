 thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Tủ đổi pin/Lỗi khoang pin` · `Tủ đổi pin/Lỗi pin`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.4 (tra tần suất lỗi khóa của tủ này rồi quyết định thay cụm khóa zz) → `Tủ đổi pin/Lỗi cánh cửa tủ pin` hoặc `Tủ đổi pin/Lỗi hao mòn cơ khí trụ (Han rỉ, hỏng khóa cửa)` hoặc `Tủ đổi pin/Lỗi khoang pin` · bước 4.5 (thay cụm khóa bằng khóa zz) → `Tủ đổi pin/Lỗi cánh cửa tủ pin` hoặc `Tủ đổi pin/Lỗi hao mòn cơ khí trụ (Han rỉ, hỏng khóa cửa)` hoặc `Tủ đổi pin/Lỗi khoang pin`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"BSS","code":"C6029","name":"Lock timeout - khóa không ngàm/nhả bất thường","onsite":true,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / tủ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Đến trạm, lỗi đã hết, đo bước 2.1 thấy hạ tầng **bình thường**, không reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / tủ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** tủ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.3 *Kiểm tra cơ khí cụm khóa*: Phát hiện dị vật/lệch/kẹt | **E6** |\n| Bước 4.5 *Thay cụm khóa bằng khóa ZZ*: Thay xong, thử đóng/mở 3 lần đạt | **E5** |\n| Bước 4.5 *Thay cụm khóa bằng khóa ZZ*: Vẫn lỗi | **E8** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / tủ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / tủ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra tủ hoạt động bình thường\"*.\n- **Mã phần cứng — mặc định onsite.** E0/E1 chỉ hợp lệ khi solution **thêm** lời khách xác nhận một nguyên nhân hạ tầng tạm thời (mất điện, mất mạng, aptomat trạm nhảy, thi công…) đã được khắc phục, có người xác nhận và thời điểm. Thiếu → **reopen** (bắt buộc onsite). Lỗi hết sau reset mà không có xác nhận đó thì reset chỉ là khôi phục tạm, không đóng được.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, tủ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- **Mã phần cứng — E0 và E1 tại trạm:** bắt buộc thêm bước 2.1 *Loại trừ hạ tầng điện và mạng*: giá trị đo nguồn cấp và trạng thái RCBO/modem trong solution, kèm ảnh tủ điện/RCBO · thông số đo · modem/đèn tín hiệu. Đo thấy hạ tầng bình thường thì **vẫn là E0 / E1**, không phải E2. Thiếu giá trị đo hoặc ảnh 2.1 → **reopen**. Không cần lời khách xác nhận.\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** tủ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.3 — Kiểm tra cơ khí cụm khóa → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra ngàm khóa, cảm biến vị trí, dị vật, mòn, lệch. · Vệ sinh và chỉnh lại nếu cần.\n- Nhánh đóng: Phát hiện dị vật/lệch/kẹt: khắc phục — đóng **E6** nếu chỉ chỉnh/vệ sinh.\n- **Bằng chứng (Xong khi):** Ảnh cụm khóa TRƯỚC và SAU khi xử lý\n- **Ảnh:** Ảnh cụm khóa trước · Ảnh cụm khóa sau\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.5 — Thay cụm khóa bằng khóa ZZ → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thay bằng ĐÚNG họ khóa ZZ (After-sales Module ZZ - BSS Gen 1). · Thay bằng họ khóa khác không tính là đã xử lý theo RCA.\n- Nhánh đóng: Thay xong, thử đóng/mở 3 lần đạt: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau khi thay, thử đóng/mở 3 lần tại thời điểm xử lý đều đạt; ghi kết quả 3 lần thử vào Repair description (solution) là đủ, không cần ảnh/video cho việc thử\n- **Ảnh:** Ảnh khóa cũ · Ảnh khóa mới thấy rõ là khóa ZZ\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.5**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Tủ online, có kết nối mạng trên hệ thống\n- [ ] Không còn cảnh báo của mã này trên màn hình tủ / hệ thống\n- [ ] Khoang / cửa liên quan đóng, mở và khóa được bình thường\n- [ ] Thực hiện thử một lượt đổi pin thành công *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ (tem chân đế / tem cánh cửa / tem trên màn hình) · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề · Ảnh xử lý lỗi · Ảnh màn hình sau khi xử lý\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** bắt buộc khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi · **Mã này là mã phần cứng — `E0` và `E1` tại trạm**: thêm giá trị đo, ảnh tủ điện/RCBO · ảnh thông số đo · ảnh modem/đèn tín hiệu (bước 2.1)\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Tủ đổi pin/Lỗi khoang pin` · `Tủ đổi pin/Lỗi pin`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.4 (tra tần suất lỗi khóa của tủ này rồi quyết định thay cụm khóa zz) → `Tủ đổi pin/Lỗi cánh cửa tủ pin` hoặc `Tủ đổi pin/Lỗi hao mòn cơ khí trụ (Han rỉ, hỏng khóa cửa)` hoặc `Tủ đổi pin/Lỗi khoang pin` · bước 4.5 (thay cụm khóa bằng khóa zz) → `Tủ đổi pin/Lỗi cánh cửa tủ pin` hoặc `Tủ đổi pin/Lỗi hao mòn cơ khí trụ (Han rỉ, hỏng khóa cửa)` hoặc `Tủ đổi pin/Lỗi khoang pin`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"BSS","code":"C6030","name":"Unlock bất thường","onsite":true,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / tủ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Đến trạm, lỗi đã hết, đo bước 2.1 thấy hạ tầng **bình thường**, không reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / tủ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** tủ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Đối chứng với log giao dịch đổi pin*: Có phiên đổi pin trùng thời điểm và có dấu hiệu người dùng giữ/rút pin khi đang cắm | **E3** |\n| Bước 4.2 *Kiểm tra cảm biến vị trí khóa của khoang*: Phát hiện bất thường | **E6** / **E5** — theo thao tác thực tế |\n| Bước 4.3 *Thử đóng/mở khoang nhiều lần*: Tái hiện được hiện tượng tự nhả | **E5** |\n| Bước 4.3 *Thử đóng/mở khoang nhiều lần*: Không tái hiện sau 3 lần và đã loại trừ bước 4.1–2 | **E8** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / tủ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / tủ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra tủ hoạt động bình thường\"*.\n- **Mã phần cứng — mặc định onsite.** E0/E1 chỉ hợp lệ khi solution **thêm** lời khách xác nhận một nguyên nhân hạ tầng tạm thời (mất điện, mất mạng, aptomat trạm nhảy, thi công…) đã được khắc phục, có người xác nhận và thời điểm. Thiếu → **reopen** (bắt buộc onsite). Lỗi hết sau reset mà không có xác nhận đó thì reset chỉ là khôi phục tạm, không đóng được.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, tủ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- **Mã phần cứng — E0 và E1 tại trạm:** bắt buộc thêm bước 2.1 *Loại trừ hạ tầng điện và mạng*: giá trị đo nguồn cấp và trạng thái RCBO/modem trong solution, kèm ảnh tủ điện/RCBO · thông số đo · modem/đèn tín hiệu. Đo thấy hạ tầng bình thường thì **vẫn là E0 / E1**, không phải E2. Thiếu giá trị đo hoặc ảnh 2.1 → **reopen**. Không cần lời khách xác nhận.\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** tủ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra cảm biến vị trí khóa của khoang → E6 / E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra cảm biến vị trí khóa: lỏng, lệch, bẩn, sai khoảng cách với chốt tác động.\n- Nhánh đóng: Phát hiện bất thường: chỉnh/vệ sinh — đóng **E6**; thay cảm biến — đóng **E5**.\n- **Bằng chứng (Xong khi):** Ảnh cảm biến và chốt TRƯỚC và SAU\n- **Ảnh:** Ảnh cảm biến trước · Ảnh cảm biến sau\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.3 — Thử đóng/mở khoang nhiều lần → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thao tác đóng/mở khoang lặp lại (3 lần), quan sát có tự nhả không.\n- Nhánh đóng: Tái hiện được hiện tượng tự nhả: thay cụm khóa/cảm biến — đóng **E5**.\n- **Bằng chứng (Xong khi):** Số lần thử và kết quả từng lần, ghi vào Repair description (solution) là đủ, không cần ảnh/video\n- **Ảnh:** Logfile nếu đi đóng E8\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.3**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Tủ online, có kết nối mạng trên hệ thống\n- [ ] Không còn cảnh báo của mã này trên màn hình tủ / hệ thống\n- [ ] Khoang / cửa liên quan đóng, mở và khóa được bình thường\n- [ ] Thực hiện thử một lượt đổi pin thành công *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ (tem chân đế / tem cánh cửa / tem trên màn hình) · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề · Ảnh xử lý lỗi · Ảnh màn hình sau khi xử lý\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** bắt buộc khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi · **Mã này là mã phần cứng — `E0` và `E1` tại trạm**: thêm giá trị đo, ảnh tủ điện/RCBO · ảnh thông số đo · ảnh modem/đèn tín hiệu (bước 2.1)\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Tủ đổi pin/Lỗi khoang pin` · `Tủ đổi pin/Lỗi pin`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"BSS","code":"C6100","name":"Pin bật ra không có lệnh","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / tủ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / tủ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** tủ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Đối chứng với log giao dịch đổi pin*: Có phiên đổi pin trùng thời điểm và có dấu hiệu người dùng giữ/rút pin khi đang cắm | **E3** |\n| Bước 4.2 *Kiểm tra cảm biến vị trí khóa của khoang*: Phát hiện bất thường | **E6** / **E5** — theo thao tác thực tế |\n| Bước 4.3 *Thử đóng/mở khoang nhiều lần*: Tái hiện được hiện tượng tự nhả | **E5** |\n| Bước 4.3 *Thử đóng/mở khoang nhiều lần*: Không tái hiện sau 3 lần và đã loại trừ bước 4.1–2 | **E8** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / tủ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / tủ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra tủ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, tủ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** tủ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra cảm biến vị trí khóa của khoang → E6 / E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra cảm biến vị trí khóa: lỏng, lệch, bẩn, sai khoảng cách với chốt tác động.\n- Nhánh đóng: Phát hiện bất thường: chỉnh/vệ sinh — đóng **E6**; thay cảm biến — đóng **E5**.\n- **Bằng chứng (Xong khi):** Ảnh cảm biến và chốt TRƯỚC và SAU\n- **Ảnh:** Ảnh cảm biến trước · Ảnh cảm biến sau\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.3 — Thử đóng/mở khoang nhiều lần → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thao tác đóng/mở khoang lặp lại (3 lần), quan sát có tự nhả không.\n- Nhánh đóng: Tái hiện được hiện tượng tự nhả: thay cụm khóa/cảm biến — đóng **E5**.\n- **Bằng chứng (Xong khi):** Số lần thử và kết quả từng lần, ghi vào Repair description (solution) là đủ, không cần ảnh/video\n- **Ảnh:** Logfile nếu đi đóng E8\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.3**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Tủ online, có kết nối mạng trên hệ thống\n- [ ] Không còn cảnh báo của mã này trên màn hình tủ / hệ thống\n- [ ] Khoang / cửa liên quan đóng, mở và khóa được bình thường\n- [ ] Thực hiện thử một lượt đổi pin thành công *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ (tem chân đế / tem cánh cửa / tem trên màn hình) · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề · Ảnh xử lý lỗi · Ảnh màn hình sau khi xử lý\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** bắt buộc khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Tủ đổi pin` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Tủ đổi pin/Lỗi khoang pin` · `Tủ đổi pin/Lỗi pin`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"}]};
if (!DATA) { document.body.innerHTML = "<p style='padding:24px'>Đây là template. Mở <b>C:/sop-guide/index.html</b> (sinh bằng <code>node scripts/gen-sop-guide.mjs</code>).</p>"; throw 0; }
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const render = (md) => (window.marked ? marked.parse(md) : "<pre>" + esc(md) + "</pre>");
const families = [...new Set(DATA.sops.map((s) => s.family))];
const id = (s) => "sop/" + s.family.replace(/ /g, "") + "/" + s.code;
const badge = (s) => s.onsite ? '<span class="tag t-warn">Đến trạm</span>' : '<span class="tag t-ok">Từ xa</span>';

function buildNav(filter = "") {
  const f = filter.trim().toLowerCase();
  $("#navlib").innerHTML = families.map((fam) => {
    const items = DATA.sops.filter((s) => s.family === fam && (!f || (s.code + " " + s.name + " " + fam).toLowerCase().includes(f)));
    if (!items.length) return "";
    return `<div class="grp"><b>${fam} (${items.length})</b>` +
      items.map((s) => `<a class="it" href="#${id(s)}" title="${esc(s.name)}"><code>${s.code}</code><span>${esc(s.name)}</span></a>`).join("") + "</div>";
  }).join("") || '<p class="sub" style="margin:12px 8px">Không tìm thấy mã nào.</p>';
  markActive();
}
function markActive() {
  const h = location.hash.slice(1);
  document.querySelectorAll("nav a.it").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + h));
}
function home(anchor) {
  $("#main").innerHTML = $("#tpl-flow").innerHTML;
  $("#libgrid").innerHTML = families.map((fam) => {
    const items = DATA.sops.filter((s) => s.family === fam);
    return `<div class="fam"><h4>${fam}<small>${items.length} mã</small></h4><div class="lib">` + items.map((s) =>
      `<a href="#${id(s)}"><code>${s.code}</code>${badge(s)}<small>${esc(s.name)}</small></a>`).join("") + "</div></div>";
  }).join("");
  const el = anchor && document.getElementById(anchor);
  el ? el.scrollIntoView() : scrollTo(0, 0);
}
function page(crumb, title, sub, body) {
  $("#main").innerHTML = `<div class="sophead"><div class="crumb"><a href="#lib">Thư viện SOP</a> › ${crumb}</div>
    <h2>${title}</h2>${sub}</div><div class="sop">${body}</div>`;
  scrollTo(0, 0);
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const s = DATA.sops.find((x) => id(x) === h);
  if (s) page(s.family, `${s.code} — ${esc(s.name)}`, `<p class="sub" style="margin:0">Dòng máy <b>${s.family}</b> · ${badge(s)}</p>`, render(s.md));
  else if (h === "general") page("Thay vật tư", "Luật thay vật tư", "", render(DATA.general));
  else home(h);
  markActive();
}
$("#q").addEventListener("input", (e) => buildNav(e.target.value));
addEventListener("hashchange", route);
buildNav();
route();
</script>
</body>
