<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hướng dẫn SOP AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f4f6f5;--panel:#fff;--text:#16211e;--muted:#5d6b67;--line:#dfe5e3;--soft:#eef2f1;
  --accent:#0f766e;--accent-2:#14b8a6;--accent-bg:#e2f4f1;
  --ok:#15803d;--ok-bg:#e3f5e8;--warn:#a16207;--warn-bg:#fdf3d7;--bad:#b91c1c;--bad-bg:#fde8e8;--code-bg:#eef2f1;
  --shadow:0 1px 2px rgba(16,33,30,.05),0 4px 14px rgba(16,33,30,.06);--hero:linear-gradient(135deg,#0f766e,#14b8a6);--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--panel:#172120;--text:#e6eeec;--muted:#93a39f;--line:#283533;--soft:#1d2a28;
  --accent:#2dd4bf;--accent-2:#5eead4;--accent-bg:#123330;--ok:#4ade80;--ok-bg:#12301d;--warn:#facc15;--warn-bg:#352c0e;--bad:#f87171;--bad-bg:#3a1717;--code-bg:#1f2d2b;--shadow:none;--hero:linear-gradient(135deg,#115e59,#0f766e);--on-accent:#0f1514}}
:root[data-theme="dark"]{--bg:#0f1514;--panel:#172120;--text:#e6eeec;--muted:#93a39f;--line:#283533;--soft:#1d2a28;
  --accent:#2dd4bf;--accent-2:#5eead4;--accent-bg:#123330;--ok:#4ade80;--ok-bg:#12301d;--warn:#facc15;--warn-bg:#352c0e;--bad:#f87171;--bad-bg:#3a1717;--code-bg:#1f2d2b;--shadow:none;--hero:linear-gradient(135deg,#115e59,#0f766e);--on-accent:#0f1514}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
/* thanh cuộn */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 45%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:100vh}

/* ---- thanh bên ---- */
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 4px 16px}
.brand i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-weight:700}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
nav input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font:inherit;font-size:14px}
nav input:focus{outline:2px solid var(--accent);outline-offset:1px}
nav .grp{margin-top:16px}
nav .grp>b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 8px 4px}
nav a.it{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;color:var(--text);font-size:14px;border-left:3px solid transparent}
nav a.it:hover{background:var(--soft);text-decoration:none}
nav a.it.on{background:var(--accent-bg);color:var(--accent);border-left-color:var(--accent)}
nav a.it code{font-weight:600;background:none;padding:0}
nav a.it span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a.it.on span{color:inherit}

/* ---- nội dung ---- */
main{padding:32px 40px 80px;max-width:1080px;width:100%;margin:0 auto}
h2{font-size:26px;line-height:1.3;margin:0 0 6px}
h3{font-size:19px;margin:40px 0 12px;display:flex;align-items:center;gap:10px}
h3 .no{width:28px;height:28px;border-radius:8px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:14px}
h4{font-size:15px;margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
code{background:var(--code-bg);padding:1px 6px;border-radius:5px;font-size:.9em}
table{border-collapse:separate;border-spacing:0;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
th,td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-weight:600}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 10px 10px 0}
blockquote p{margin:0}

.hero{background:var(--hero);color:#fff;border-radius:16px;padding:26px 28px;box-shadow:var(--shadow)}
.hero h2{color:#fff;font-size:28px}
.hero p{margin:0;opacity:.92;max-width:680px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stats span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-ok{color:var(--ok);background:var(--ok-bg)}.t-warn{color:var(--warn);background:var(--warn-bg)}.t-bad{color:var(--bad);background:var(--bad-bg)}.t-info{color:var(--accent);background:var(--accent-bg)}

.steps{list-style:none;padding:0;margin:16px 0;counter-reset:s;position:relative}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 54px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;display:grid;place-items:center;font-size:14px;box-shadow:0 0 0 4px var(--accent-bg)}
.steps li::after{content:"";position:absolute;left:16px;top:38px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow)}
.steps li>div>b:first-child{display:block;margin-bottom:2px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--line)}
.card.ok{border-top-color:var(--ok)}.card.warn{border-top-color:var(--warn)}.card.bad{border-top-color:var(--bad)}.card.info{border-top-color:var(--accent)}
.card h5{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card dl{margin:6px 0 0;font-size:14px}
.card dt{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.card dd{margin:0}

.exits{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin:12px 0}
.exit{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.exit>b{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:15px}
.exit div{font-size:14px}
.exit small{display:block;color:var(--muted);font-size:12px}
.e-a>b{background:var(--ok-bg);color:var(--ok)}.e-b>b{background:var(--warn-bg);color:var(--warn)}.e-c>b{background:var(--accent-bg);color:var(--accent)}.e-d>b{background:var(--bad-bg);color:var(--bad)}

.note{background:var(--accent-bg);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}

.fam{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.fam h4{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.fam h4 small{color:var(--muted);font-weight:500}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.lib a{background:var(--soft);border:1px solid transparent;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text);transition:.12s}
.lib a:hover{border-color:var(--accent);background:var(--panel);text-decoration:none}
.lib a code{font-weight:700;background:none;padding:0;margin-right:4px}
.lib a small{display:block;color:var(--muted);margin-top:2px;line-height:1.35}

.sophead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:8px;box-shadow:var(--shadow)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.sop h2{margin-top:34px;padding:8px 12px;background:var(--soft);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;font-size:19px}
.sop h3{margin:24px 0 8px;font-size:16px;color:var(--accent)}
.sop li{margin:4px 0}
.sop ul{padding-left:22px}
.sop strong{font-weight:600}
.sop input[type=checkbox]{accent-color:var(--accent);margin-right:6px}

.top{position:fixed;right:18px;bottom:18px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.top:hover{text-decoration:none;filter:brightness(1.08)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px 80px}.hero{padding:20px}}
</style>
</head>

<nav>
  <div class="brand"><i>AI</i><div><b>Hướng dẫn SOP AI</b><small>Dành cho CSE</small></div></div>

</nav>

<template id="tpl-flow">
<div class="hero">
  <h2>AI chấm vé theo SOP</h2>
  <p>Vé có mã lỗi nằm trong SOP sẽ được AI đọc và chấm theo đúng SOP của mã đó. Hiện đang <b>chạy thử</b>: hệ thống chỉ ghi lại kết quả để CSE đối chiếu, <b>chưa ghi gì lên CCTS</b>.</p>
  <div class="stats"><span>55 mã lỗi</span><span>6 dòng máy</span><span>Đang chạy thử</span></div>
</div>

<h3 id="flow"><span class="no">1</span>Một vé đi qua 6 bước</h3>
<ol class="steps">
  <li><div><b>Tìm SOP</b>Tra theo <b>dòng máy</b> + <b>mã lỗi</b> của vé. Không có SOP → bỏ qua, vé đi luồng cũ.</div></li>
  <li><div><b>Gom dữ liệu vé</b>Solution, ảnh, Spare Parts Record, Reason Explanation, và <b>số vé cùng mã, cùng S/N trong 7 ngày</b> (đếm trên CCTS).</div></li>
  <li><div><b>Chặn sớm</b>Vé có hơn 48 ảnh, hoặc có thay vật tư mà SOP của mã không có lối ra E5 → <b>chuyển người xử lý</b>.</div></li>
  <li><div><b>AI đọc SOP + vé</b>Chọn <b>lối ra</b> (E0–E8), kiểm từng mục <b>bằng chứng</b>, đọc ảnh checklist và ảnh vật tư, chọn Additional Info, rồi đề xuất kết quả.</div></li>
  <li><div><b>Hệ thống kiểm lại</b>Áp các luật cứng (mục 3). Sai luật nào → <b>trả lại KTV</b>, liệt kê <b>tất cả</b> lý do một lần để KTV sửa một lượt.</div></li>
  <li><div><b>Ra kết quả</b>Đóng vé / Trả lại KTV / Chuyển người xử lý (mục 2).</div></li>
</ol>

<h3><span class="no">2</span>Ba kết quả</h3>
<div class="cards">
  <div class="card ok"><h5><span class="tag t-ok">Đóng vé</span></h5><p>Lối ra rõ ràng, đủ bằng chứng.</p></div>
  <div class="card warn"><h5><span class="tag t-warn">Trả lại KTV</span></h5><p>Lối ra rõ nhưng thiếu bằng chứng hoặc sai luật → gửi KTV danh sách cần bổ sung.</p></div>
  <div class="card bad"><h5><span class="tag t-bad">Chuyển người xử lý</span></h5><p>Không xác định được lối ra, solution mâu thuẫn, hoặc cần CSE duyệt.</p></div>
</div>
<p class="note">Lỗi tạm thời (CCTS hoặc AI quá tải) → không ghi gì, hệ thống chạy lại sau.</p>

<h3 id="rules"><span class="no">3</span>Luật hệ thống tự kiểm (không phụ thuộc AI)</h3>
<div class="cards">
  <div class="card warn"><h5>Vé thứ 3 trong 7 ngày</h5><dl>
    <dt>Áp cho</dt><dd>Vé đóng <b>từ xa</b> E0/E1, mã <span class="tag t-ok">Được đóng từ xa</span></dd>
    <dt>Sai khi</dt><dd>Đã có từ 2 vé trước cùng mã, cùng S/N → trả lại, phải đến trạm</dd></dl></div>
  <div class="card warn"><h5>Mã phần cứng</h5><dl>
    <dt>Áp cho</dt><dd>Vé đóng <b>từ xa</b> E0/E1, mã <span class="tag t-warn">Phải đến trạm</span></dd>
    <dt>Sai khi</dt><dd>Không có lời khách xác nhận nguyên nhân hạ tầng → trả lại. <b>Có</b> lời khách → chuyển CSE duyệt</dd></dl></div>
  <div class="card warn"><h5>Checklist nghiệm thu</h5><dl>
    <dt>Áp cho</dt><dd><b>Mọi vé tại trạm</b>, và mọi vé E5/E6</dd>
    <dt>Sai khi</dt><dd>Không có ảnh checklist · chưa điền · S/N trên checklist không khớp S/N hoặc mã trạm · tem lệch S/N của vé</dd></dl></div>
  <div class="card warn"><h5>Ảnh vật tư</h5><dl>
    <dt>Áp cho</dt><dd>Vé có thay vật tư (Good parts)</dd>
    <dt>Sai khi</dt><dd>Thiếu ảnh bắt buộc · ảnh không đính kèm trong Spare Parts Record · một ảnh dùng cho 2 mục · ảnh không có dấu ngày giờ, hoặc lệch quá ±1 ngày so với ngày làm solution</dd></dl></div>
  <div class="card bad"><h5>Additional Info</h5><dl>
    <dt>Áp cho</dt><dd>Mọi vé</dd>
    <dt>Sai khi</dt><dd>AI chọn giá trị ngoài danh sách của lối ra → chuyển người xử lý</dd></dl></div>
</div>

<h3 id="exits"><span class="no">4</span>Các lối ra E0–E8 — dừng ở đâu thì đóng theo đó</h3>
<div class="exits">
  <div class="exit e-a"><b>E0</b><div>Lỗi tự hết trước khi động vào — không reset, không sửa<small>Từ xa / Tại trạm</small></div></div>
  <div class="exit e-a"><b>E1</b><div>Chạy lại sau reset (chưa biết nguyên nhân gốc)<small>Từ xa / Tại trạm</small></div></div>
  <div class="exit e-b"><b>E2</b><div>Do điện / mạng / môi trường của trạm<small>Tại trạm</small></div></div>
  <div class="exit e-b"><b>E3</b><div>Do bên ngoài: xe, người dùng, đội thi công<small>Từ xa / Tại trạm</small></div></div>
  <div class="exit e-b"><b>E4</b><div>Do firmware / cấu hình (chỉ một số mã)<small>Từ xa / Tại trạm</small></div></div>
  <div class="exit e-c"><b>E5</b><div><b>Thay</b> linh kiện hoàn chỉnh — cần Spare Parts Record + ảnh<small>Tại trạm</small></div></div>
  <div class="exit e-c"><b>E6</b><div>Sửa không thay linh kiện: dây, tiếp xúc, lắp đặt, cơ khí, cảm biến, vệ sinh<small>Tại trạm</small></div></div>
  <div class="exit e-d"><b>E7</b><div>Lỗi firmware đã được CCG/RCA xác nhận, chờ bản sửa<small>Tại trạm</small></div></div>
  <div class="exit e-d"><b>E8</b><div>Làm hết các bước mà chưa ra nguyên nhân<small>Tại trạm</small></div></div>
</div>

<h3><span class="no">5</span>Đóng từ xa — hai loại mã</h3>
<div class="cards">
  <div class="card ok"><h5><span class="tag t-ok">Được đóng từ xa</span> 36 mã</h5><p>Solution ghi <b>việc đã làm + kết quả</b> là đủ (vd: "reset từ xa, trụ hoạt động bình thường"). Không cần ảnh. Trừ khi là vé thứ 3 trong 7 ngày.</p></div>
  <div class="card warn"><h5><span class="tag t-warn">Phải đến trạm</span> 19 mã</h5><p>Mã phần cứng. Chỉ đóng từ xa khi <b>khách xác nhận</b> sự cố hạ tầng tạm thời đã khắc phục <b>và</b> CPO/CCTS thấy cảnh báo đã hết.</p></div>
</div>
<p class="note">Đã <b>đến trạm</b> thì không xét luật vé thứ 3, nhưng <b>bắt buộc</b> có ảnh checklist nghiệm thu.</p>

<h3 id="check"><span class="no">6</span>CSE cần kiểm gì khi xem kết quả AI</h3>
<ol class="steps">
  <li><div><b>Lối ra có đúng không?</b>Mở SOP của mã (thư viện bên dưới) → <i>Bước 1 — Xác định lối ra từ solution</i>. Solution khớp dòng nào thì phải là lối ra đó.</div></li>
  <li><div><b>Lý do trả lại có đúng không?</b>Mỗi lý do phải chỉ đúng thứ còn thiếu. Ảnh được gọi bằng nhãn <code>TICKET_img:n</code> = ảnh thứ n của vé.</div></li>
  <li><div><b>Vé được đóng có thiếu gì không?</b>Đối chiếu <i>Bước 2 — Kiểm bằng chứng theo lối ra</i>, đúng mục của lối ra AI chọn.</div></li>
  <li><div><b>Additional Info</b>Handling code, Error detail, Caused by ChargeCore phải khớp <i>Bước 3 — Điền Additional Info</i>.</div></li>
  <li><div><b>Ghi lại chỗ AI sai</b>Kèm Ticket ID + kết quả đúng, gửi team để chỉnh SOP / AI.</div></li>
</ol>

<h3 id="lib"><span class="no">7</span>Thư viện SOP — chọn dòng máy, rồi mã lỗi</h3>
<p class="sub"><span class="tag t-ok">Từ xa</span> được đóng từ xa &nbsp; <span class="tag t-warn">Đến trạm</span> mặc định phải đến trạm</p>
<div id="libgrid"></div>

<script>
const DATA = {"general":"Áp dụng khi Spare Parts Record có dòng *Good parts*, **bất kể linh kiện là gì và bất kể lối ra**. Bổ sung cho SOP của mã lỗi: SOP mã lỗi nói *thay gì*, mục này nói *thay xong cần ảnh gì* và *Solution ghi gì*. Thiếu bất kỳ mục nào → reopen.\n\n## Ảnh vật tư\n\n- `parts_required` do hệ thống tính từ mã vật tư — ground truth, không tự tra lại loại vật tư. Mỗi dòng Good parts một bộ ảnh, liệt từng mục theo đúng thứ tự.\n- Với **từng mục ảnh** của từng dòng, trả `TICKET_img:\u003cn>` của ảnh thể hiện đúng mục đó, hoặc `null` nếu không có ảnh nào đạt. Không dùng một ảnh cho hai mục.\n- Chỉ **ảnh** được tính. Video, logfile, file nén đính kèm vẫn nộp nếu SOP yêu cầu, nhưng **không thay được ảnh**.\n- Mỗi ảnh chụp **một nội dung**. Một ảnh chụp chung nhiều thứ chỉ tính là một ảnh.\n- Ảnh rõ nét, đủ sáng, không phản quang, không bị tay hay dụng cụ che.\n- Ảnh vật tư đính kèm ở **Spare Parts Record**: ảnh linh kiện MỚI (cả bao bì và ảnh sau khi lắp) ở dòng *Good parts*; ảnh linh kiện HỎNG (cả ảnh hư hỏng và ảnh đóng gói gửi trả) ở *Broken parts*. Ảnh chỉ có trong Solution **không tính** cho bộ ảnh vật tư.\n- Ảnh phải có **watermark thời gian** (Timemark hoặc ứng dụng tương đương) của chính lần xử lý. Ảnh không watermark (ảnh catalog, ảnh tải về, ảnh chụp lại màn hình) hoặc watermark lệch **quá 1 ngày** so với ngày làm solution → **không tính**.\n- 3 ảnh nền (S/N · trước xử lý · sau xử lý) trùng checklist ảnh onsite của mã lỗi — kiểm ở đó, **không** liệt lại ở đây.\n\n## Ảnh hư hỏng vật lý\n\nÁp dụng cho **mọi loại** vật tư, **cộng thêm** vào bộ ảnh ở mục 3. Đây là loại ảnh R&D cần nhất, và mất vĩnh viễn nếu không chụp trước khi tháo hoặc trước khi đóng gói.\n\n- **Khi:** Linh kiện hỏng có dấu hiệu hư hỏng vật lý: cháy, xém, nổ, bung vỡ, phồng, chảy nhựa, nứt, ăn mòn, chân linh kiện cong / gãy.\n  - [ ] Cận cảnh TỪNG điểm hư hỏng — mỗi điểm ít nhất 1 ảnh, thấy rõ vị trí điểm hỏng trên linh kiện (chụp thêm một ảnh xa hơn nếu cận cảnh không cho thấy vị trí)\n- **Khi:** Có cháy / nổ lan ra ngoài linh kiện (vỏ tủ, dây, linh kiện lân cận).\n  - [ ] Ảnh khu vực xung quanh linh kiện trong thiết bị TRƯỚC khi tháo, thấy mức lan\n\n## Solution khi thay vật tư\n\nẢnh cho thấy đã thay gì; **Solution phải nói vì sao phải thay**. R&D và CSE đọc Solution để biết linh kiện hỏng trong hoàn cảnh nào — ảnh không trả lời được câu đó. Viết ở *Solution Description*, theo cú pháp CCTS **Người thực hiện + Các công việc tại site + Nguyên nhân và vật tư thay thế**, và phải có đủ **5 ý**:\n\n| # | Ý | Phải ghi | Ví dụ |\n|---|---|---|---|\n| 1 | **Hiện tượng** | Lỗi thực tế khi đến trạm: mã lỗi trên màn hình / đèn báo và hiện tượng quan sát được, chỉ rõ súng / khoang / khe số mấy | Màn hình báo C2006 (quá nhiệt súng) ở súng 2, đang sạc thì dừng |\n| 2 | **Kết luận** | Linh kiện nào hỏng, ở vị trí nào, hỏng thế nào (cháy, chập, chết nguồn, kẹt, gãy…) | Hỏng cảm biến nhiệt đầu súng số 2, một chân đầu súng bị xém |\n| 3 | **Vì sao thay** | Bằng chứng dẫn tới quyết định THAY chứ không sửa / vệ sinh / cấu hình lại: đã thử bước nào mà không hết lỗi, đo ra giá trị gì (có đo thì ghi con số), đảo chéo thì lỗi đi theo linh kiện. Mỗi dòng vật tư một lý do | Vệ sinh, siết lại đầu súng vẫn lỗi; nhiệt súng 2 báo 120°C trong khi súng 1 là 35°C ở cùng thời điểm, súng sờ không nóng |\n| 4 | **Vật tư đã thay** | Tên vật tư, số lượng, vị trí lắp — khớp Spare Parts Record | Thay 1 DC Charging Cable ở súng 2 |\n| 5 | **Kết quả sau thay** | Kiểm tra THỰC TẾ sau khi thay: sạc thử / đóng nhả pin / mã lỗi đã hết trên màn hình | Sạc thử xe VF8 20 phút ở súng 2, nhiệt súng bình thường, không còn C2006 |\n\n**Ghi thêm theo loại vật tư:**\n\n- `HV`: Ghi mã lỗi đã dẫn tới thay bo (họ cách điện D14xx…) và giá trị đo cách điện nếu có đo. Ghi version bo cũ -> bo mới (vd V2.7 -> V2.8).\n- `BOARD`: Ghi version bo cũ -> bo mới.\n- `MODULE_SN`: Ghi S/N module cũ -> module mới và số khe lắp.\n\n**Mẫu câu:**\n\n> [Người thực hiện] đến trạm. Hiện tượng: … Kiểm tra: … Kết luận: … Thay … vì … Sau thay: …\n\n**Ví dụ đạt:**\n\n> Kỹ thuật đến trạm. Hiện tượng: màn hình báo C2006 (quá nhiệt súng) ở súng 2, đang sạc thì dừng. Kiểm tra: vệ sinh, siết lại đầu súng vẫn lỗi; nhiệt súng 2 báo 120°C trong khi súng 1 là 35°C ở cùng thời điểm, súng sờ không nóng; một chân đầu súng 2 bị xém. Kết luận: hỏng cảm biến nhiệt đầu súng số 2. Thay 1 DC Charging Cable ở súng 2 vì cảm biến báo sai và chân súng đã xém, vệ sinh không hết. Sau thay: sạc thử xe VF8 20 phút ở súng 2, nhiệt bình thường, không còn C2006.\n\n**Không đạt:**\n\n- Chỉ ghi 'thay X, trụ hoạt động bình thường' — thiếu hiện tượng, kết luận, lý do\n- Chỉ 'ok', 'hdbt', 'phối hợp cc', dấu câu\n- Lý do chung chung 'do hỏng', 'do lỗi' mà không có bằng chứng\n- Vật tư nêu trong solution khác Spare Parts Record\n\nThay nhiều vật tư: mỗi vật tư một câu *vì sao thay*. Vé có nhiều solution (xử lý nhiều lần) thì các solution **cộng lại** phải đủ các ý trên.\n","sops":[{"family":"Core","code":"A0112","name":"Door Access Detected","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.2 *Kiểm tra cảm biến cửa*: Nếu cảm biến hoạt động ổn định sau khi điều chỉnh | **E6** |\n| Bước 4.3 *Thay thế cảm biến cửa*: Nếu lỗi được khắc phục | **E5** |\n| Bước 4.4 *Kiểm tra dây phản hồi chạm vỏ*: Nếu phát hiện bất thường | **E6** |\n| Bước 4.5 *Thay thế SECC để loại trừ nguyên nhân*: Nếu lỗi được khắc phục | **E5** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra cảm biến cửa → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra tình trạng hoạt động của cảm biến cửa. · Kiểm tra vị trí lắp đặt, độ thẳng hàng và khoảng cách giữa cảm biến và chốt tác động. · Điều chỉnh lại vị trí cảm biến nếu phát hiện lắp đặt không phù hợp.\n- Nhánh đóng: Nếu cảm biến hoạt động ổn định sau khi điều chỉnh: Hoàn tất xử lý và đóng ticket — hết lỗi và đạt tiêu chí phục hồi: đóng **E6**.\n- **Bằng chứng (Xong khi):** Cảm biến hoạt động ổn định sau khi điều chỉnh. Ghi ĐẠT / KHÔNG ĐẠT cho từng việc của bước: (1) kiểm tra tình trạng hoạt động của cảm biến cửa; (2) kiểm tra vị trí lắp đặt, độ thẳng hàng và khoảng cách giữa cảm biến và chốt tác động; (3) điều chỉnh lại vị trí cảm biến nếu phát hiện lắp đặt không phù hợp — mục không đạt thì mô tả cụ thể; mỗi mục một ảnh tại đúng điểm đã kiểm.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.3 — Thay thế cảm biến cửa → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thay thế cảm biến cửa tại vị trí phát sinh lỗi. · Theo dõi trạng thái hoạt động của trụ sau khi thay thế.\n- Nhánh đóng: Nếu lỗi được khắc phục: Hoàn tất xử lý và đóng ticket — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau thao tác của bước này, solution ghi không phát sinh lại mã lỗi này trong thời gian còn ở trạm, VÀ đạt tiêu chí phục hồi; kèm bộ ảnh vật tư theo `parts_required` (mục *Thay vật tư*)\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### Bước 4.4 — Kiểm tra dây phản hồi chạm vỏ → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra toàn bộ dây phản hồi tín hiệu cảnh báo cửa về SECC. · Kiểm tra hiện tượng chạm vỏ, đứt ngầm hoặc tiếp xúc không ổn định trên đường dây tín hiệu.\n- Nhánh đóng: Nếu phát hiện bất thường: Khắc phục và kiểm tra lại tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E6**.\n- **Bằng chứng (Xong khi):** Ảnh điểm đấu nối TRƯỚC và SAU khi xử lý.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.5 — Thay thế SECC để loại trừ nguyên nhân → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Sau khi đã xác nhận cảm biến cửa và hệ thống dây tín hiệu hoạt động bình thường. · Thực hiện thay thế SECC để loại trừ nguyên nhân phần cứng. · Việc thay thế phải có sự xác nhận và hỗ trợ từ đội ngũ CCG-CSE.\n- Nhánh đóng: Nếu lỗi được khắc phục: Hoàn tất xử lý và đóng ticket — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau thao tác của bước này, solution ghi không phát sinh lại mã lỗi này trong thời gian còn ở trạm, VÀ đạt tiêu chí phục hồi; kèm bộ ảnh vật tư theo `parts_required` (mục *Thay vật tư*)\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.5**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi công tắc cửa`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.3 (thay thế cảm biến cửa) → `Trụ sạc OTĐ/Lỗi công tắc cửa` · bước 4.5 (thay thế secc để loại trừ nguyên nhân) → `Trụ sạc OTĐ/Lỗi modul SECC` hoặc `Trụ sạc OTĐ/Lỗi mạch SECC`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Core","code":"A0414","name":"Input Under Voltage","onsite":true,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Đến trạm, lỗi đã hết, đo bước 2.1 thấy hạ tầng **bình thường**, không reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Đo điện áp đầu vào tại HAI điểm*: Điện áp thấp ngay tại tủ điện trạm | **E2** |\n| Bước 4.2 *Kiểm tra đầu cốt, aptomat và contactor đầu vào*: Phát hiện lỏng hoặc cháy rỗ | **E6** |\n| Bước 4.3 *Xác định module báo lỗi và thay AD-DC Power Module*: Thay xong chạy thử đạt | **E5** |\n| Bước 4.3 *Xác định module báo lỗi và thay AD-DC Power Module*: Vẫn lỗi | **E8** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- **Mã phần cứng — mặc định onsite.** E0/E1 chỉ hợp lệ khi solution **thêm** lời khách xác nhận một nguyên nhân hạ tầng tạm thời (mất điện, mất mạng, aptomat trạm nhảy, thi công…) đã được khắc phục, có người xác nhận và thời điểm. Thiếu → **reopen** (bắt buộc onsite). Lỗi hết sau reset mà không có xác nhận đó thì reset chỉ là khôi phục tạm, không đóng được.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- **Mã phần cứng — E0 và E1 tại trạm:** bắt buộc thêm bước 2.1 *Loại trừ hạ tầng điện và mạng*: giá trị đo nguồn cấp và trạng thái RCBO/modem trong solution, kèm ảnh tủ điện/RCBO · thông số đo · modem/đèn tín hiệu. Đo thấy hạ tầng bình thường thì **vẫn là E0 / E1**, không phải E2. Thiếu giá trị đo hoặc ảnh 2.1 → **reopen**. Không cần lời khách xác nhận.\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra đầu cốt, aptomat và contactor đầu vào → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra siết đầu cốt, dấu phóng điện, tiếp điểm contactor AC.\n- Nhánh đóng: Phát hiện lỏng hoặc cháy rỗ: khắc phục — đóng **E6**, hoặc E5 nếu thay contactor.\n- **Bằng chứng (Xong khi):** Ảnh từng điểm đấu nối trước và sau khi siết\n- **Ảnh:** Ảnh đầu cốt trước · Ảnh đầu cốt sau\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.3 — Xác định module báo lỗi và thay AD-DC Power Module → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Đọc log hoặc màn hình để biết module nào báo under voltage, thay đúng module đó.\n- Nhánh đóng: Thay xong chạy thử đạt: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau khi thay, chạy thử một phiên sạc không phát sinh lại A0414\n- **Ảnh:** Ảnh module hỏng · Ảnh module mới · Ảnh màn hình sau khi chạy thử\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.3**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi · **Mã này là mã phần cứng — `E0` và `E1` tại trạm**: thêm giá trị đo, ảnh tủ điện/RCBO · ảnh thông số đo · ảnh modem/đèn tín hiệu (bước 2.1)\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi Modun nguồn`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.3 (xác định module báo lỗi và thay ad-dc power module) → `Trụ sạc OTĐ/Lỗi Modun nguồn`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Core","code":"B0207","name":"Data Mismatch","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E4` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.2 *Tra phiên bản firmware so bản phát hành*: Sai bản | **E4** |\n| Bước 4.3 *Chuyển CCG điều tra — không tự xử lý tiếp*: Đã thu đủ bằng chứng và gửi CCG | **E8** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → SOP của mã này **không có lối ra E5** → `exit = NONE`, **manual**, ghi lý do vào `manualReason`. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Tra phiên bản firmware so bản phát hành → E4\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Đối chiếu FW với bản phát hành chuẩn.\n- Nhánh đóng: Sai bản: cập nhật — đóng **E4**.\n- **Bằng chứng (Xong khi):** Ảnh phiên bản FW\n- **Ảnh:** Ảnh phiên bản FW\n- **E4:** phiên bản FW / cấu hình trước và sau · sau cập nhật hết lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.3**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E4** | Do firmware / cấu hình | Từ xa / Tại trạm | `Update FW · Chạy lại FW` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Update Firmware/comfig file` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi treo mất kết nối` · `Trụ sạc OTĐ/Lỗi FW trụ sạc`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Core","code":"C0116","name":"Fan Failure","onsite":true,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Đến trạm, lỗi đã hết, đo bước 2.1 thấy hạ tầng **bình thường**, không reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Kiểm tra tình trạng tấm lọc bụi (Filter)*: Nếu tấm lọc bẩn | **E5** / **E6** — theo thao tác thực tế |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- **Mã phần cứng — mặc định onsite.** E0/E1 chỉ hợp lệ khi solution **thêm** lời khách xác nhận một nguyên nhân hạ tầng tạm thời (mất điện, mất mạng, aptomat trạm nhảy, thi công…) đã được khắc phục, có người xác nhận và thời điểm. Thiếu → **reopen** (bắt buộc onsite). Lỗi hết sau reset mà không có xác nhận đó thì reset chỉ là khôi phục tạm, không đóng được.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- **Mã phần cứng — E0 và E1 tại trạm:** bắt buộc thêm bước 2.1 *Loại trừ hạ tầng điện và mạng*: giá trị đo nguồn cấp và trạng thái RCBO/modem trong solution, kèm ảnh tủ điện/RCBO · thông số đo · modem/đèn tín hiệu. Đo thấy hạ tầng bình thường thì **vẫn là E0 / E1**, không phải E2. Thiếu giá trị đo hoặc ảnh 2.1 → **reopen**. Không cần lời khách xác nhận.\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.1 — Kiểm tra tình trạng tấm lọc bụi (Filter) → E5 / E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra tình trạng bụi bẩn của tấm lọc tại mặt hông bên trái và bên phải của trụ. · Đánh giá mức độ bám bụi ảnh hưởng đến khả năng lưu thông khí.\n- Nhánh đóng: Nếu tấm lọc bẩn: Thực hiện vệ sinh hoặc thay thế tấm filter và tiếp tục theo dõi tình trạng vận hành của trụ — hết lỗi và đạt tiêu chí phục hồi thì lối ra theo thao tác THỰC TẾ đã làm: **thay spare part hoàn thiện** được quản lý (ghi Spare Parts Record) là đóng **E5**; **xử lý không thay spare part** (vệ sinh / chỉnh / siết / cắm lại, dùng vật tư tiêu hao thông thường) là đóng **E6**. Ghi rõ đã làm cái nào vào Repair description.\n- **Bằng chứng (Xong khi):** Ảnh TRƯỚC và SAU khi vệ sinh, hai ảnh khác nhau rõ rệt.\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.2**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi · **Mã này là mã phần cứng — `E0` và `E1` tại trạm**: thêm giá trị đo, ảnh tủ điện/RCBO · ảnh thông số đo · ảnh modem/đèn tín hiệu (bước 2.1)\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp,
