được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi cảm biến nhiệt` · `Trụ sạc OTĐ/Lỗi trụ khác`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Kern","code":"A0302","name":"Supply Controller Communication Loss","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E4` · `E5` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.2 *Kiểm tra và cập nhật Firmware*: Trường hợp Firmware chưa phải phiên bản mới nhất | **E4** |\n| Bước 4.3 *Kiểm tra nguồn cấp 24V cho bo SECC*: Nếu nguồn bất thường | **E5** |\n| Bước 4.5 *Kiểm tra trạng thái bo SECC*: Nếu phát hiện lỗi | **E5** |\n| Bước 4.6 *Thay thế linh kiện để loại trừ nguyên nhân*: Nếu lỗi được khắc phục | **E5** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra và cập nhật Firmware → E4\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Đối chiếu phiên bản Firmware hiện tại với phiên bản Firmware mới nhất.\n- Nhánh đóng: Trường hợp Firmware chưa phải phiên bản mới nhất: Thực hiện cập nhật Firmware, thu thập log trước và sau khi cập nhật, theo dõi tình trạng hoạt động của trụ — hết lỗi và đạt tiêu chí phục hồi: đóng **E4**.\n- **Bằng chứng (Xong khi):** Firmware đã là phiên bản mới nhất và lỗi không còn xuất hiện. Ảnh phiên bản FW hiện tại; ghi phiên bản vào Repair description và nêu đã đúng hay chưa đúng bản phát hành chuẩn.\n- **E4:** phiên bản FW / cấu hình trước và sau · sau cập nhật hết lỗi.\n\n### Bước 4.3 — Kiểm tra nguồn cấp 24V cho bo SECC → E5\n\n- `mode` = onsite.\n- Nhánh đóng: Nếu nguồn bất thường: Xử lý hoặc thay thế nguồn, sau đó kiểm tra lại lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Nguồn bình thường. Ghi giá trị đo được vào Repair description, kèm ảnh đồng hồ đo tại đúng điểm đo.\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### Bước 4.5 — Kiểm tra trạng thái bo SECC → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Bật nguồn trạm sạc. · Quan sát trạng thái hoạt động của bo SECC. · DẤU HIỆU LỖI PHẦN CỨNG: - Quạt Power Module chạy tối đa tốc độ ngay sau khi khởi động. · Đèn LED trạng thái trên bo SECC hoạt động bất thường.\n- Nhánh đóng: Nếu phát hiện lỗi: Chụp ảnh hoặc quay video hiện trạng, thay thế bo SECC và theo dõi tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Quan sát từng quạt khi thiết bị đang tải; ghi quạt nào không quay.\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### Bước 4.6 — Thay thế linh kiện để loại trừ nguyên nhân → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thay thế bo SECC và theo dõi kết quả. · Nếu lỗi vẫn tồn tại, thay thế bo QT và tiếp tục theo dõi kết quả.\n- Nhánh đóng: Nếu lỗi được khắc phục: Hoàn tất xử lý và đóng hồ sơ — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau thao tác của bước này, solution ghi không phát sinh lại mã lỗi này trong thời gian còn ở trạm, VÀ đạt tiêu chí phục hồi; kèm bộ ảnh vật tư theo `parts_required` (mục *Thay vật tư*)\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.7**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E4** | Do firmware / cấu hình | Từ xa / Tại trạm | `Update FW · Chạy lại FW` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Update Firmware/comfig file` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi giao tiếp QT và SECC` · `Trụ sạc OTĐ/Lỗi modul SECC`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.6 (thay thế linh kiện để loại trừ nguyên nhân) → `Trụ sạc OTĐ/Lỗi modul SECC` hoặc `Trụ sạc OTĐ/Lỗi mạch SECC` · bước 4.7 (liên hệ hỗ trợ kỹ thuật) → `Trụ sạc OTĐ/Lỗi modul SECC` hoặc `Trụ sạc OTĐ/Lỗi mạch SECC`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Kern","code":"A0401","name":"Power Module Communication Loss","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E4` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Kiểm tra phiên bản Firmware SECC*: Nếu Firmware chưa phải phiên bản mới nhất | **E4** |\n| Bước 4.2 *Kiểm tra dây tín hiệu từ Module về SECC*: Nếu phát hiện đầu nối lỏng hoặc bất thường | **E6** |\n| Bước 4.3 *Kiểm tra kết nối động lực của Module*: Nếu phát hiện bất thường | **E6** |\n| Bước 4.4 *Kiểm tra và thay thế Power Module*: Nếu lỗi được khắc phục | **E5** |\n| Bước 4.5 *Thay thế SECC*: Nếu lỗi được khắc phục | **E5** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.1 — Kiểm tra phiên bản Firmware SECC → E4\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Đối chiếu phiên bản Firmware hiện tại với phiên bản Firmware mới nhất được phê duyệt. · Thu thập log để phục vụ phân tích nếu cần.\n- Nhánh đóng: Nếu Firmware chưa phải phiên bản mới nhất: Thực hiện cập nhật Firmware và theo dõi tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E4**.\n- **Bằng chứng (Xong khi):** Firmware đã là phiên bản mới nhất và lỗi không còn tồn tại. Ảnh phiên bản FW hiện tại; ghi phiên bản vào Repair description và nêu đã đúng hay chưa đúng bản phát hành chuẩn.\n- **E4:** phiên bản FW / cấu hình trước và sau · sau cập nhật hết lỗi.\n\n### Bước 4.2 — Kiểm tra dây tín hiệu từ Module về SECC → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra toàn bộ dây tín hiệu kết nối từ Power Module về cổng J1 trên board SECC. · Đảm bảo các đầu nối được cắm đúng vị trí và tiếp xúc chắc chắn.\n- Nhánh đóng: Nếu phát hiện đầu nối lỏng hoặc bất thường: Khắc phục và kiểm tra lại tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E6**.\n- **Bằng chứng (Xong khi):** Dây tín hiệu bình thường. Ảnh điểm đấu nối TRƯỚC và SAU khi xử lý.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.3 — Kiểm tra kết nối động lực của Module → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra terminal động lực đầu vào của Power Module. · Kiểm tra tình trạng bắt vít của Module, đảm bảo Module được cố định chắc chắn trên khung lắp đặt.\n- Nhánh đóng: Nếu phát hiện bất thường: Khắc phục và kiểm tra lại tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E6**.\n- **Bằng chứng (Xong khi):** Kết nối động lực bình thường. Ảnh điểm đấu nối TRƯỚC và SAU khi xử lý.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.4 — Kiểm tra và thay thế Power Module → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thực hiện thay thế thử Power Module để loại trừ nguyên nhân phần cứng. · Lưu ý: Xác suất lỗi Power Module thấp do hiện tượng này thường xảy ra khi mất kết nối đồng thời toàn bộ Module.\n- Nhánh đóng: Nếu lỗi được khắc phục: Hoàn tất thay thế và đóng ticket — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau thao tác của bước này, solution ghi không phát sinh lại mã lỗi này trong thời gian còn ở trạm, VÀ đạt tiêu chí phục hồi; kèm bộ ảnh vật tư theo `parts_required` (mục *Thay vật tư*)\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### Bước 4.5 — Thay thế SECC → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Thực hiện thay thế board SECC để loại trừ nguyên nhân phần cứng. · Theo dõi trạng thái vận hành sau khi thay thế.\n- Nhánh đóng: Nếu lỗi được khắc phục: Hoàn tất xử lý và đóng ticket — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau thao tác của bước này, solution ghi không phát sinh lại mã lỗi này trong thời gian còn ở trạm, VÀ đạt tiêu chí phục hồi; kèm bộ ảnh vật tư theo `parts_required` (mục *Thay vật tư*)\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.5**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E4** | Do firmware / cấu hình | Từ xa / Tại trạm | `Update FW · Chạy lại FW` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Update Firmware/comfig file` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi Modun nguồn` · `Trụ sạc OTĐ/Lỗi giao tiếp Module và SECC`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.4 (kiểm tra và thay thế power module) → `Trụ sạc OTĐ/Lỗi Modun nguồn` · bước 4.5 (thay thế secc) → `Trụ sạc OTĐ/Lỗi modul SECC` hoặc `Trụ sạc OTĐ/Lỗi mạch SECC`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Kern","code":"A0414","name":"Input Under Voltage","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Đo điện áp đầu vào tại HAI điểm*: Điện áp thấp ngay tại tủ điện trạm | **E2** |\n| Bước 4.2 *Kiểm tra đầu cốt, aptomat và contactor đầu vào*: Phát hiện lỏng hoặc cháy rỗ | **E6** |\n| Bước 4.3 *Xác định module báo lỗi và thay AD-DC Power Module*: Thay xong chạy thử đạt | **E5** |\n| Bước 4.3 *Xác định module báo lỗi và thay AD-DC Power Module*: Vẫn lỗi | **E8** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra đầu cốt, aptomat và contactor đầu vào → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra siết đầu cốt, dấu phóng điện, tiếp điểm contactor AC.\n- Nhánh đóng: Phát hiện lỏng hoặc cháy rỗ: khắc phục — đóng **E6**, hoặc E5 nếu thay contactor.\n- **Bằng chứng (Xong khi):** Ảnh từng điểm đấu nối trước và sau khi siết\n- **Ảnh:** Ảnh đầu cốt trước · Ảnh đầu cốt sau\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.3 — Xác định module báo lỗi và thay AD-DC Power Module → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Đọc log hoặc màn hình để biết module nào báo under voltage, thay đúng module đó.\n- Nhánh đóng: Thay xong chạy thử đạt: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau khi thay, chạy thử một phiên sạc không phát sinh lại A0414\n- **Ảnh:** Ảnh module hỏng · Ảnh module mới · Ảnh màn hình sau khi chạy thử\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.3**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi Modun nguồn`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.3 (xác định module báo lỗi và thay ad-dc power module) → `Trụ sạc OTĐ/Lỗi Modun nguồn`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Kern","code":"A0902","name":"AC Contactor Error","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E4` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.1 *Kiểm tra phiên bản Firmware*: Nếu Firmware hiện tại chưa phải phiên bản mới nhất | **E4** |\n| Bước 4.3 *Kiểm tra dây điều khiển và tín hiệu phản hồi*: Nếu phát hiện dây đứt, lỏng hoặc điện trở bất thường | **E6** |\n| Bước 4.6 *Kiểm tra AC Contactor*: Nếu AC Contactor hoạt động bất thường | **E5** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.1 — Kiểm tra phiên bản Firmware → E4\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra phiên bản Firmware hiện tại của trụ. · Đối chiếu với phiên bản Firmware mới nhất đã được phê duyệt triển khai.\n- Nhánh đóng: Nếu Firmware hiện tại chưa phải phiên bản mới nhất: Thực hiện cập nhật Firmware và theo dõi tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E4**.\n- **Bằng chứng (Xong khi):** Ảnh phiên bản FW hiện tại; ghi phiên bản vào Repair description và nêu đã đúng hay chưa đúng bản phát hành chuẩn.\n- **E4:** phiên bản FW / cấu hình trước và sau · sau cập nhật hết lỗi.\n\n### Bước 4.3 — Kiểm tra dây điều khiển và tín hiệu phản hồi → E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra thông mạch toàn bộ đường điều khiển Relay KA1, board SECC và mạch đi qua nút Emergency Stop. · Kiểm tra dây tín hiệu phản hồi AC Contactor.\n- Nhánh đóng: Nếu phát hiện dây đứt, lỏng hoặc điện trở bất thường: Khắc phục và kiểm tra lại — hết lỗi và đạt tiêu chí phục hồi: đóng **E6**.\n- **Bằng chứng (Xong khi):** Tín hiệu bình thường nhưng lỗi vẫn tồn tại. Ảnh điểm đấu nối TRƯỚC và SAU khi xử lý.\n- **E6:** không có Spare Parts Record (có → là E5) · ảnh trước và sau · sau xử lý hết lỗi.\n\n### Bước 4.6 — Kiểm tra AC Contactor → E5\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Quan sát trạng thái đóng/ngắt của AC Contactor khi khởi động. · Kiểm tra phản hồi hoạt động của AC Contactor chính.\n- Nhánh đóng: Nếu AC Contactor hoạt động bất thường: Thực hiện thay thế — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Ghi ĐẠT / KHÔNG ĐẠT cho từng việc của bước: (1) quan sát trạng thái đóng/ngắt của AC Contactor khi khởi động; (2) kiểm tra phản hồi hoạt động của AC Contactor chính — mục không đạt thì mô tả cụ thể; mỗi mục một ảnh tại đúng điểm đã kiểm.\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required` do hệ thống tính từ mã vật tư) · logfile offline theo dòng *Logfile offline* ở mục Ảnh bắt buộc của mã này · sau khi thay không phát sinh lại mã lỗi.\n\n### E7 — chờ FW\n\n- Đủ mọi điều kiện E8 **cộng**: FW đã là bản mới nhất **và** CCG/RCA đã xác nhận là lỗi FW đã biết. Chỉ ghi \"FW mới nhất\" → là E8.\n\n### E8 — chưa ra nguyên nhân\n\n- Bốn điều kiện BẮT BUỘC có đủ mới được đóng E8: (1) đã đi hết các bước ở phần 4 của mã này và ghi kết quả từng bước; (2) có logfile offline đính kèm; (3) đã đối chiếu phiên bản FW với bản phát hành; (4) ghi rõ trong Reason Explanation là chưa xác định được nguyên nhân gốc.\n- Solution phải có kết quả **từng bước 4.1–4.6**. Thiếu → reject, không được lùi về E1/E3.\n\n### Chung cho các lối ra onsite\n\n- Solution đủ 4 phần: hiện tượng · các bước và kết quả **từng bước** · dừng ở đâu, lối ra nào · tiêu chí phục hồi. Có thay part thì phải có chữ *thay*.\n- Bước bị bỏ qua phải có lý do. Các bước **sau** bước đã đóng vé thì không áp dụng.\n- Ảnh chụp ở chính lần xử lý này; có ít nhất một ảnh tổng quan thấy S/N của đúng thiết bị.\n- **Video / logfile:** chỉ kiểm **có hay không** — có tệp đúng loại trong `attachments` là đạt; **không** kiểm nội dung video / logfile. \"Video hoặc ảnh\" thì có một trong hai là đạt.\n- **Mọi vé tại trạm, ở mọi lối ra:** bắt buộc đạt dòng *Checklist nghiệm thu sau sửa chữa* ở mục Ảnh bắt buộc bên dưới. S/N trên checklist và trên tem chỉ được **đọc từ ảnh**, không chép S/N của ticket. Thiếu / sai → **reopen**.\n\n**Tiêu chí phục hồi** (bắt buộc với E0, E1, E4, E5, E6; E2, E3, E7, E8 được phép chưa đạt nhưng phải ghi mục nào chưa đạt và ai xử lý tiếp):\n\n- [ ] Trụ báo trạng thái xanh — ở ĐÚNG cổng sạc báo lỗi (trụ hai cổng thì kiểm cả hai)\n- [ ] Trụ có kết nối mạng\n- [ ] Không còn chuông cảnh báo hiển thị trên màn hình, ở cả hai cổng\n- [ ] Sạc thử được một phiên bình thường *(tuỳ chọn)*\n\n**Ảnh bắt buộc:**\n\n**Ticket onsite — checklist bắt buộc đủ 100%, thiếu một mục là cần bổ sung:** Ảnh SN của trụ( Có thể lấy từ tem chân đế/tem cánh cửa/tem trên màn · Ảnh màn hình trước khi đến trụ · Ảnh hiện trạng tại thiết bị xảy ra vấn đề( Optional) · Ảnh xử lí lỗi · Ảnh màn hình sau khi xử lí\n\n**Checklist nghiệm thu sau sửa chữa** — bắt buộc với **mọi vé đã đến trạm**, ở mọi lối ra (`E0`, `E1`, `E2`, `E3`, `E4` tại trạm, và `E5`, `E6`, `E7`, `E8`): có ảnh tờ *CHECKLIST NGHIỆM THU SAU SỬA CHỮA* của lần xử lý này, đã tick các hạng mục, có chữ ký KTV và tick kết luận nghiệm thu; S/N ghi trên checklist (ô *Mã trụ / trạm* hoặc *Mã sự vụ*) phải **trùng** S/N trên ảnh tem/nhãn của thiết bị và S/N của ticket trên CCTS. Thiếu ảnh checklist, checklist bỏ trống, hoặc S/N không ghi / ghi sai → **reopen**, yêu cầu KTV chụp hoặc up lại ảnh checklist đúng.\n\n**Logfile offline:** **bắt buộc** khi thay vật tư (đóng `E5`) và khi đóng `E8`; trường hợp khác đính kèm nếu lấy được.\n\n**Ticket remote:** không bắt buộc ảnh — solution ghi hành động + kết quả · E0: đã kiểm tra, lỗi đã hết trước khi động vào · E1: đã reset, sau reset lỗi đã hết / trụ hoạt động bình thường · Vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày: không đóng từ xa (phải đến trạm; đã đến trạm thì không xét luật này) · Có khách xác nhận: ghi nội dung, người, thời điểm vào Repair description\n\n**Ticket `E0` tại trạm:** ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* · solution ghi cảnh báo đã kết thúc, không reset, không sửa, kèm kết quả tiêu chí phục hồi\n\n---\n\n## Bước 3 — Điền Additional Info\n\nÔ nào trong bảng ghi nhiều giá trị là **danh sách để chọn**, không phải chỗ chờ chốt. Chọn theo \"Dừng vì\" và thao tác thực tế trong solution:\n\n- **Handling code E5:** chọn nhãn khớp linh kiện đã thay (theo Spare Parts Record / solution): bo mạch, module, cảm biến, màn hình → `Thay LK điện tử`; khóa, cơ cấu, chi tiết cơ khí → `Thay LK cơ khí`; thiết bị đóng cắt / thiết bị điện → `Thay thiết bị điện`; thiết bị mạng → `Thay thiết bị mạng`; camera → `Thay thiết bị CAM`; thay cả thiết bị → `Thay trụ sạc`.\n- **Handling code E6:** theo thao tác — dây / đầu nối / tiếp xúc → `Kiểm tra xử lý dây tín hiệu trong tủ`; lắp đặt lại, chỉnh cảm biến / góc CAM / chốt → `Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM`; vệ sinh → `Vệ sinh/bảo dưỡng`; móp, vỡ, vênh → `Sửa lỗi cơ khí (Móp, vỡ…)`. Làm nhiều thao tác thì chọn nhiều mã.\n- **Error detail:** chọn **một** giá trị trong danh sách của mã này, theo bộ phận thực sự hỏng / đã thay (E5 phải khớp Spare Parts Record). E0/E1 không thay gì: chọn giá trị khớp nhất với mô tả mã lỗi và solution; không phân định được thì lấy giá trị **đầu tiên** của danh sách.\n\nNguyên văn bảng đóng vé và luật điền của mã này trong SOP:\n\n| Mã | Dừng vì | Handling type | Handling code | Error groups | Repair category | Caused by ChargeCore | Problem Category |\n|---|---|---|---|---|---|---|---|\n| **E0** | Lỗi tự hết trước khi mình động vào — kiểm tra (từ xa hoặc tại trạm) đã hết, không reset, không sửa | Từ xa / Tại trạm | `Đóng cảnh báo` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Error recover by it self` |\n| **E1** | Chạy lại sau reset — chưa kết luận nguyên nhân gốc | Từ xa / Tại trạm | `Reset từ xa · Reset cứng` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **No** | `Others/Restart and error recover` |\n| **E2** | Do điện / mạng / môi trường tại trạm | Tại trạm | `Kiểm tra hạ tầng (điện/mạng)` | `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Site environmental factors( Network/Power...)` |\n| **E3** | Do bên ngoài: xe, người dùng, đội bảo dưỡng | Từ xa / Tại trạm | `Miễn trừ` | `Lỗi do người dùng` / `Lỗi khách quan` | `Sửa chữa bảo hành` | **No** | `Disclaimer/Customer fault nếu do người dùng · Disclaimer/Other external causes nếu do bên thứ ba` |\n| **E4** | Do firmware / cấu hình | Từ xa / Tại trạm | `Update FW · Chạy lại FW` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Update Firmware/comfig file` |\n| **E5** | Đã thay linh kiện | Tại trạm | theo linh kiện đã thay: `Thay LK điện tử` · `Thay LK cơ khí` · `Thay thiết bị điện` · `Thay thiết bị mạng` · `Thay thiết bị CAM` · `Thay trụ sạc` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Electronic(PCBA) nếu thay bo mạch · Design quality/System nếu thay linh kiện khác` |\n| **E6** | Xử lý không thay linh kiện (spare part hoàn thiện): dây, tiếp xúc, lắp đặt, cơ khí, chỉnh cảm biến | Tại trạm | `theo thao tác: Kiểm tra xử lý dây tín hiệu trong tủ · Lắp đặt lại, kết nối lại cáp kết nối, chỉnh góc CAM · Vệ sinh/bảo dưỡng · Sửa lỗi cơ khí (Móp, vỡ…)` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **theo thao tác — xem bảng ngay dưới** | `theo thao tác — xem bảng ngay dưới` |\n| **E7** | Lỗi FW đã được CCG/RCA xác nhận, đang chờ bản sửa | Tại trạm | `Chờ bản FW mới` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `Design quality/Pending FW` |\n| **E8** | Làm hết mà vẫn không ra nguyên nhân | Tại trạm | `Khác phục sự cố khác` | `Trụ sạc OTĐ` | `Sửa chữa bảo hành` | **Yes** | `TBC` |\n\n**Problem Category khi đóng `E6`** — chọn theo thao tác đã làm:\n\n| Thao tác | Problem Category | Caused by ChargeCore | Vì sao |\n|---|---|---|---|\n| Dây, đầu nối, tiếp xúc: siết / cắm / bấm lại, xử lý chạm vỏ, thay đoạn dây bằng vật tư tiêu hao | `Others/Wire loose` | **Yes / No — xét theo nội dung solution** | đúng nghĩa 'lỏng dây / tuột dây'; chép đúng chuỗi dropdown CCTS |\n| Vệ sinh, bảo dưỡng: lọc bụi, quạt bám bụi, khe thông gió | `Disclaimer/Customer fault` | **No** | CSE: bụi bẩn do khách hàng không vệ sinh, không phải lỗi ChargeCore |\n| Lắp đặt sai, chỉnh cảm biến, chỉnh góc CAM, chỉnh chốt khóa | `Manufacturing quality/Workmanship` | **Yes / No — xét theo nội dung solution** | 'lỗi công nhân thao tác' — lắp/chỉnh chưa đúng |\n| Cơ khí: móp, vỡ, vênh, hao mòn kết cấu | `Design quality/structure` | **Yes / No — xét theo nội dung solution** | 'lỗi cấu trúc' |\n\n> **Caused by ChargeCore ở các dòng *xét theo nội dung solution*:** người chấm / AI đọc solution để tự điền, **không** chép lại lựa chọn của ASP. **Yes** khi solution cho thấy nguyên nhân nằm ở chính thiết bị ChargeCore (lỗi sản xuất / lắp ráp xuất xưởng, dây hoặc đầu nối lỏng từ nhà máy, linh kiện kém, hao mòn trong điều kiện dùng bình thường). **No** khi nguyên nhân do lắp đặt / thi công hiện trường của bên khác, tác động bên ngoài (va chạm, phá hoại), môi trường hoặc người dùng. Solution không đủ thông tin để phân định → không tự đoán, chuyển xử lý thủ công.\n\n> **Xử lý hoặc thay đoạn dây, đầu nối bằng vật tư tiêu hao thông thường vẫn là `E6`** — mô tả thao tác, ảnh trước/sau, không đòi Spare Parts Record. Chỉ chuyển `E5` khi thay một **spare part hoàn thiện** được quản lý (ví dụ cả cụm dây / cáp có mã part), ghi Spare Parts Record, Error detail theo đúng part đã thay.\n\n**Error detail** — chọn MỘT, theo bộ phận thực sự hỏng / đã thay, chép đúng chuỗi:\n\n- Lỗi thiết bị (E0, E1, E4–E8): `Trụ sạc OTĐ/Lỗi AC contactor` · `Trụ sạc OTĐ/Lỗi treo mất kết nối`\n- **Gợi ý theo bước có thay linh kiện**: bước 4.4 (kiểm tra relay ka1) → `Trụ sạc OTĐ/Lỗi mạch điều khiển rơle` hoặc `Trụ sạc OTĐ/Lỗi rơle` · bước 4.5 (thay thế board secc) → `Trụ sạc OTĐ/Lỗi modul SECC` hoặc `Trụ sạc OTĐ/Lỗi mạch SECC`\n- E2 hạ tầng: `Lỗi khách quan/Lỗi EVN cắt điện` · `Lỗi khách quan/Lỗi chất lượng điện (điện áp không ổn định/ mất pha)` · `Lỗi khách quan/Lỗi mạng (dây mạng/ mất mạng)` · `Lỗi khách quan/Lỗi mất mạng/điện do yếu tố khách quan` (đơn vị thi công, chủ mặt bằng…) · `Lỗi khách quan/Lỗi thiên tai, thời tiết`\n- E3 người dùng / bên ngoài: `Lỗi do người dùng/Lỗi khách nhấn nút EMG` · `Lỗi do người dùng/Lỗi khách phá hoại tài sản trạm sạc` · `Lỗi do người dùng/Lỗi do KH khác` · `Lỗi khách quan/Lỗi mất cắp thiết bị` · `Lỗi khách quan/Lỗi sụt lún, rạn nứt mặt bằng do địa chất`\n\n- **Handling code bắt buộc điền, không để trống.** Chọn được nhiều mã nếu làm nhiều đầu mục, nối bằng dấu phẩy **không có khoảng trắng**.\n- `Đóng cảnh báo` **chỉ** dùng cho E0 — lỗi tự hết, solution ghi đã kiểm tra và lỗi đã hết. Không dùng nó cho trường hợp nào khác.\n- **Error groups phải trùng phần đứng trước dấu `/` của Error detail** — `Trụ sạc OTĐ/…` đi với `Trụ sạc OTĐ`, `Lỗi khách quan/…` đi với `Lỗi khách quan`. Vé BSS thì là `Tủ đổi pin`, không bao giờ là `Trụ sạc OTĐ`.\n- **Error detail không có giá trị nào khớp nguyên nhân / linh kiện thật** thì chọn giá trị *khác* của đúng nhóm: `Trụ sạc OTĐ/Lỗi trụ khác` (lỗi thiết bị) · `Lỗi khách quan/Lỗi khách quan khác` (hạ tầng, bên ngoài) · `Lỗi do người dùng/Lỗi do KH khác` (người dùng) — và ghi nguyên nhân thật, tên linh kiện vào **Reason Explanation**. Đây là **thiếu sót của SOP**, sẽ bổ sung sau; người chấm **không** tính lỗi KTV. Vé **Tủ đổi pin**: danh mục CCTS chưa có giá trị *khác* nào — chọn giá trị gần nhất, ghi rõ trong Reason Explanation và báo CSE. Có giá trị cụ thể khớp mà vẫn chọn giá trị *khác* thì là chọn sai.\n- **Đóng `E5` thì Error detail phải khớp ĐÚNG linh kiện ghi trong Spare Parts Record** (thay SECC thì không chọn detail về công tắc cửa; thay AC meter thì không chọn detail về DC meter), không đổi sang linh kiện khác cho khớp danh mục.\n- **Ranh giới `E2` và `E6` — theo VỊ TRÍ ĐO và bộ phận gây lỗi.** Nguồn / mạng / môi trường **ngoài** thiết bị (đo tại tủ điện trạm, lưới, modem nhà mạng, aptomat của trạm) là `E2`. Đấu nối hoặc linh kiện **thuộc** thiết bị, xử lý mà không thay mới (siết lại đầu cốt, cắm lại jack, vệ sinh tiếp điểm, chỉnh cảm biến) là `E6`. Đo được ở cả hai điểm thì ghi cả hai giá trị và lấy điểm đầu tiên bất thường làm nguyên nhân.\n- **Ranh giới `E5` và `E6` là CÓ THAY SPARE PART HOÀN THIỆN được quản lý hay không.** Thay spare part hoàn thiện (bo mạch, module, contactor, cảm biến, cả cụm dây / cáp được quản lý như một part…) là `E5` và bắt buộc ghi **Spare Parts Record**. Siết / cắm / bấm lại đầu nối, xử lý hoặc thay **đoạn dây bằng vật tư tiêu hao thông thường**, vệ sinh, chỉnh cảm biến là `E6`: mô tả thao tác + ảnh trước/sau, **không** đòi Spare Parts Record. Bước SOP ghi *'vệ sinh hoặc thay X'* thì lối ra phụ thuộc thao tác **thực tế đã làm**, ghi rõ đã làm cái nào vào Repair description.\n"},{"family":"Kern","code":"B0701","name":"DC Meter Communication Loss","onsite":false,"md":"Lối ra có trong bảng đóng vé của mã này: `E0` · `E1` · `E2` · `E3` · `E4` · `E5` · `E6` · `E7` · `E8`\n\n\n## Bước 1 — Xác định lối ra từ solution\n\nĐọc phần ASP ghi \"dừng ở bước nào, lối ra nào\". ASP không ghi rõ thì suy theo thao tác:\n\n| Solution nói… | Lối ra |\n|---|---|\n| Đã kiểm tra (từ xa hoặc tại trạm), lỗi đã hết / trụ hoạt động bình thường, **không** reset, không sửa | **E0** |\n| Reset (từ xa hoặc cứng) rồi hết lỗi / trụ hoạt động bình thường, không sửa gì khác | **E1** |\n| Đo thấy điện / mạng / môi trường **ngoài** trụ **bất thường** và solution nêu hạng mục đó là nguyên nhân | **E2** |\n| Nguyên nhân là người dùng, xe, đội bảo dưỡng / thi công, bên thứ ba | **E3** |\n| Bước 4.2 *Kiểm tra DC Meter (Trường hợp chỉ một súng bị lỗi)*: Nếu lỗi được khắc phục | **E5** / **E4** / **E6** / **E0** — theo thao tác thực tế |\n| Bước 4.2 *Kiểm tra DC Meter (Trường hợp chỉ một súng bị lỗi)*: Nếu lỗi không được khắc phục hoặc tái diễn nhiều lần trên cùng một DC Meter | **E5** |\n| Bước 4.3 *Kiểm tra QT Board (Trường hợp cả hai DC Meter đều lỗi)*: Nếu lỗi vẫn tồn tại trên cả hai đầu connector sau khi khởi động lại | **E5** |\n| Bước 4.3 *Kiểm tra QT Board (Trường hợp cả hai DC Meter đều lỗi)*: Nếu lỗi được khắc phục sau khi thay thế QT Board | **E5** |\n| Đã làm hết, CCG/RCA xác nhận lỗi FW đã biết, chờ bản sửa | **E7** |\n| Đã làm hết, chưa ra nguyên nhân | **E8** |\n\nCó chữ *thay* một spare part hoàn thiện → luôn là **E5**, kể cả khi ASP chọn E6. Không xác định được lối ra → **manual**.\n\n## Bước 2 — Kiểm bằng chứng theo lối ra\n\nThiếu **bất kỳ** mục nào → không resolve; ghi mục thiếu vào `missing`.\n\n### E0 / E1 — đóng từ xa (`mode` = remote)\n\nChỉ cần **hành động + kết quả**: không bắt buộc ảnh, không cần mốc giờ, không cần đủ 4 phần solution.\n\n- **E0:** solution ghi đã kiểm tra **và** kết quả lỗi đã hết / trụ hoạt động bình thường; **không** có reset hay sửa chữa (có reset → E1).\n- **E1:** solution ghi đã reset (từ xa / cứng) **và** kết quả sau reset lỗi đã hết / trụ hoạt động bình thường. Ví dụ đạt: *\"reset từ xa, tại thời điểm kiểm tra trụ hoạt động bình thường\"*.\n- `prior_tickets_7d` ≥ 2 → **reopen**: vé thứ 3 trở lên của cùng mã, cùng S/N trong 7 ngày, bắt buộc onsite.\n- Lời khách **không** tự thay được kết quả kiểm tra: khách nói \"bình thường\" mà solution không có kết quả kiểm tra → reject.\n\n### E0 / E1 — tại trạm (`mode` = onsite)\n\n- **E0 tại trạm:** solution ghi hiện trạng lúc đến (cảnh báo đã kết thúc trên CPO/CCTS, trụ hoạt động bình thường), ghi rõ **không** reset, **không** sửa, và kết quả tiêu chí phục hồi.\n- **E1 tại trạm:** solution ghi đã reset cứng **và** kết quả sau reset.\n- Ảnh S/N của thiết bị · ảnh màn hình (AC/Socket: đèn báo) lúc kiểm tra · ảnh *Checklist nghiệm thu sau sửa chữa* (mục *Chung cho các lối ra onsite*).\n- Luật vé thứ 3 trong 7 ngày **không** áp cho vé tại trạm.\n\n### E2 — hạ tầng tại trạm\n\n- `mode` = onsite.\n- Solution nêu **hạng mục hạ tầng nào** là nguyên nhân và giá trị đo / trạng thái RCBO, modem, nguồn cấp **bất thường**.\n- Điểm bất thường nằm **ngoài** trụ. Nằm trong thiết bị thì là E6.\n- **Có giá trị đo mà tất cả bình thường thì không phải E2.** Lỗi đã hết khi đến nơi thì là E0 tại trạm.\n- Ảnh: tủ điện/RCBO, thông số đo, modem/đèn tín hiệu.\n\n### E3 — nguyên nhân bên ngoài\n\n- Solution nêu hoạt động bên ngoài cụ thể (ai, việc gì) và **nguồn xác nhận** (camera, bảo vệ, lịch thi công, vé trùng, log giao dịch).\n- Có **mốc giờ cảnh báo** và **mốc giờ hoạt động**, hai mốc trùng nhau.\n- Reason Explanation có lý do miễn trừ.\n\n### Bước 4.2 — Kiểm tra DC Meter (Trường hợp chỉ một súng bị lỗi) → E5 / E4 / E6\n\n- `mode` = onsite.\n- Solution cho thấy đã làm: Kiểm tra các dây truyền thông của DC Meter, đảm bảo được kết nối đúng vị trí và tiếp xúc chắc chắn. · Kiểm tra địa chỉ (Address) của DC Meter đã được cài đặt chính xác chưa. · Cập nhật Firmware của trụ lên phiên bản mới nhất đã được phê duyệt.\n- Nhánh đóng: Nếu lỗi được khắc phục: Tiếp tục theo dõi và đóng ticket — đóng theo thao tác đã làm: thay linh kiện đóng **E5** · cập nhật FW/cấu hình đóng **E4** · chỉnh/siết/cắm lại/vệ sinh đóng **E6** · không can thiệp gì mà lỗi đã tự hết đóng **E0**.\n- Nhánh đóng: Nếu lỗi không được khắc phục hoặc tái diễn nhiều lần trên cùng một DC Meter: Thực hiện thay thế DC Meter và theo dõi lại tình trạng lỗi — hết lỗi và đạt tiêu chí phục hồi: đóng **E5**.\n- **Bằng chứng (Xong khi):** Sau thao tác của bước này, solution ghi không phát sinh lại mã lỗi này trong thời gian còn ở trạm, VÀ đạt tiêu chí phục hồi; kèm ảnh phiên bản FW / cấu hình trước và sau\n- **E5:** có **Spare Parts Record** khớp linh kiện trong solution · **đủ bộ ảnh vật tư và Solution đủ 5 ý** theo mục *Thay vật tư* (`parts_required
